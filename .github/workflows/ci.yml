name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:0.8.7-pg18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: taskmanager_test
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U test -d taskmanager_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate
        env:
          # generate never connects: any URL-shaped value satisfies prisma.config.ts
          DATABASE_URL: postgresql://build:build@localhost:5432/build

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: |
          cp .env.test.example .env.test
          npm run test:ci

      - name: Build Docker image
        run: docker build -t task-manager-api .
